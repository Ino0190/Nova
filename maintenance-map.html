<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1963 Nova SS — Maintenance Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:24px 16px 8px}
header h1{font-size:1.6rem;color:#c0392b;letter-spacing:2px;text-transform:uppercase}
header p{color:#888;font-size:0.85rem;margin-top:4px}

.legend{display:flex;justify-content:center;gap:24px;padding:12px 0 8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:0.8rem;color:#aaa}
.legend-dot{width:12px;height:12px;border-radius:50%;border:1px solid #555}
.dot-done{background:#27ae60}.dot-plan{background:#e67e22}.dot-warn{background:#e74c3c}.dot-stock{background:#555}

#filter-bar{display:flex;justify-content:center;gap:8px;padding:8px 0;flex-wrap:wrap}
.filter-btn{background:#1a1a1a;color:#aaa;border:1px solid #333;padding:4px 14px;border-radius:3px;cursor:pointer;font-size:0.78rem;transition:all .2s}
.filter-btn:hover{border-color:#c0392b;color:#fff}
.filter-btn.active{background:#c0392b33;color:#fff;border-color:#c0392b}

/* Car image container */
#car-wrap{position:relative;max-width:1000px;margin:0 auto;padding:0 16px}
#car-wrap img{width:100%;display:block;filter:invert(1) brightness(0.85)}

/* Hotspot dots overlaid on the image using % positioning */
.hs{position:absolute;width:18px;height:18px;border-radius:50%;cursor:pointer;
    transform:translate(-50%,-50%);transition:all .25s;z-index:2;
    box-shadow:0 0 6px rgba(0,0,0,0.6)}
.hs:hover{transform:translate(-50%,-50%) scale(1.4);z-index:3}
.hs.s-done{background:#27ae60;border:2px solid #2ecc71}
.hs.s-plan{background:#e67e22;border:2px solid #f39c12}
.hs.s-warn{background:#e74c3c;border:2px solid #ff6b6b}
.hs.s-stock{background:#555;border:2px solid #777}
.hs .hs-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    white-space:nowrap;font-size:0.65rem;color:#ccc;background:#111c;
    padding:1px 5px;border-radius:2px;opacity:0;transition:opacity .2s;pointer-events:none}
.hs:hover .hs-label{opacity:1}
.hs.dimmed{opacity:0.15}
</style>
</head>
<body>
<header>
  <h1>1963 Chevrolet Chevy II Nova SS</h1>
  <p>283ci V8 · TH350 · Maintenance &amp; Mod Map</p>
</header>
<div class="legend">
  <div class="legend-item"><div class="legend-dot dot-done"></div>✅ 修理・交換済み</div>
  <div class="legend-item"><div class="legend-dot dot-plan"></div>🔧 Phase 1-3 計画</div>
  <div class="legend-item"><div class="legend-dot dot-warn"></div>⚠️ 要注意・課題あり</div>
  <div class="legend-item"><div class="legend-dot dot-stock"></div>ストック / 未着手</div>
</div>
<div id="filter-bar">
  <button class="filter-btn active" data-f="all">ALL</button>
  <button class="filter-btn" data-f="done">✅ 済み</button>
  <button class="filter-btn" data-f="plan">🔧 計画</button>
  <button class="filter-btn" data-f="warn">⚠️ 注意</button>
  <button class="filter-btn" data-f="stock">ストック</button>
</div>

<!-- Car image with hotspot overlay -->
<div id="car-wrap">
  <img src="Asset 1.svg" alt="1963 Chevy II Nova SS side view"/>
  <!-- Hotspots are injected by JS using % coordinates -->
</div>

<!-- Detail Panel (slides in from right) -->
<div id="detail-panel">
  <button id="detail-close">✕</button>
  <div id="detail-badge"></div>
  <h3 id="detail-title"></h3>
  <div id="detail-body"></div>
</div>

<!-- Stats summary -->
<div id="stats-bar"></div>

<!-- Timeline -->
<div id="timeline-wrap">
  <h3 style="color:#c0392b;font-size:0.85rem;margin-bottom:6px;text-align:center">整備タイムライン (2021–2026)</h3>
  <div id="tl-bars"></div>
  <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:#555;margin-top:2px">
    <span>2021</span><span>2022</span><span>2023</span><span>2024</span><span>2025</span><span>2026</span>
  </div>
</div>

<footer style="text-align:center;padding:16px;color:#444;font-size:0.7rem">
  Line art: Asset 1.svg · Data from NovaBlog Repair Log
</footer>

<style>
#detail-panel{position:fixed;right:-420px;top:0;width:400px;height:100vh;
  background:#111;border-left:2px solid #c0392b;padding:24px;
  overflow-y:auto;transition:right .3s ease;z-index:100}
#detail-panel.open{right:0}
#detail-close{position:absolute;top:12px;right:12px;background:none;border:none;color:#888;font-size:1.2rem;cursor:pointer}
#detail-close:hover{color:#fff}
#detail-badge{display:inline-block;padding:3px 10px;border-radius:3px;font-size:0.72rem;font-weight:bold;text-transform:uppercase;margin-bottom:8px}
#detail-badge.b-done{background:#27ae60;color:#fff}
#detail-badge.b-plan{background:#e67e22;color:#fff}
#detail-badge.b-warn{background:#e74c3c;color:#fff}
#detail-badge.b-stock{background:#555;color:#ccc}
#detail-title{color:#fff;font-size:1.05rem;margin-bottom:12px}
#detail-body{color:#bbb;font-size:0.85rem;line-height:1.6}
#detail-body h4{color:#c0392b;margin:12px 0 4px;font-size:0.88rem}
#detail-body ul{padding-left:16px;margin:4px 0 8px}
#detail-body li{margin:3px 0}
.ytag{display:inline-block;background:#222;color:#888;padding:1px 6px;border-radius:2px;font-size:0.72rem;margin-right:4px}
.ptag{display:inline-block;background:#c0392b22;color:#e67e22;padding:1px 6px;border-radius:2px;font-size:0.72rem;border:1px solid #e67e2244}

#stats-bar{max-width:1000px;margin:12px auto;padding:0 16px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.sc{background:#151515;border:1px solid #222;border-radius:4px;padding:8px 16px;text-align:center;min-width:90px}
.sc-n{font-size:1.3rem;font-weight:bold}
.sc-n.c-done{color:#27ae60}.sc-n.c-plan{color:#e67e22}.sc-n.c-warn{color:#e74c3c}.sc-n.c-stock{color:#666}
.sc-l{font-size:0.68rem;color:#888;margin-top:2px}

#timeline-wrap{max-width:1000px;margin:8px auto;padding:0 16px}
#tl-bars{display:flex;gap:3px;height:26px;border-radius:3px;overflow:hidden}
</style>

<script>
// Hotspot positions as % of image width/height
// Coordinates tuned to Asset 1.svg (viewBox 0 0 1093.08 523.52) — side view facing left
const HOTSPOTS = [
  // Front end (left side of image = front of car)
  {id:'cooling',    x:14, y:42, label:'ラジエーター/冷却系'},
  {id:'engine',     x:22, y:38, label:'283ci V8'},
  {id:'carb',       x:26, y:28, label:'AVS2 キャブ'},
  {id:'ignition',   x:30, y:35, label:'点火系/MSD SF'},
  {id:'ac',         x:18, y:55, label:'A/Cコンプレッサー'},
  {id:'waterpump',  x:16, y:48, label:'ウォーターポンプ'},

  {id:'exhaust',    x:90, y:70, label:'エキゾースト'},

  {id:'wheels',     x:19, y:88, label:'ホイール/タイヤ'},

  // Electrical
  {id:'battery',    x:10, y:38, label:'バッテリー'},
  {id:'ps-pump',    x:20, y:48, label:'パワステポンプ'},

<script src="maintenance-data.js"></script>
<script src="maintenance-app.js"></script>
<script>
// Close panel
document.getElementById('detail-close').onclick = () =>
  document.getElementById('detail-panel').classList.remove('open');
document.addEventListener('keydown', e => {
  if(e.key==='Escape') document.getElementById('detail-panel').classList.remove('open');
});
// Filter
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.f;
    document.querySelectorAll('.hs').forEach(h => {
      h.classList.toggle('dimmed', f!=='all' && h.dataset.status!==f);
    });
  };
});
</script>
</body>
</html>
